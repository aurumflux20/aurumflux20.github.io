<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AurumFlux — hero animation</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden}
  #stage{display:block;width:100vw;height:100vh}
  .ui{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;
  }
  .ui button{
    font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(255,255,255,.55);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    padding:11px 20px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px);
    transition:color .2s,border-color .2s;
  }
  .ui button:hover{color:#ffeec4;border-color:rgba(230,190,110,.55)}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="ui">
  <button onclick="AF.replay()">Replay</button>
  <button onclick="AF.spin()">Spin</button>
</div>

<script src="logo-particles.js"></script>
<script>
const AF = (() => {
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W=0,H=0,DPR=1,scale=1,cx=0,cy=0;
  let parts=[], stars=[], t0=performance.now(), spinOn=true;

  const T_DRIFT=0.9, T_GATHER=3.2, TOTAL=T_DRIFT+T_GATHER+1.0;
  const easeOutQuint = t => 1-Math.pow(1-t,5);
  const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

  function build(){
    const src = window.AF_PTS || [];
    scale = Math.min(W,H)*0.32;
    cx = W/2; cy = H/2 - H*0.03;

    parts = src.map(p => {
      const tx = p.x*scale, ty = p.y*scale;      // stored RELATIVE to centre so
      const ang = Math.atan2(ty,tx);             // the whole cloud can revolve
      const rad = Math.hypot(tx,ty);
      const spread = Math.max(W,H)*(0.55+Math.random()*0.8);
      const wind = (1.1+Math.random()*1.2)*Math.PI*2;

      // How diamond-like this particle is: the brightest facets throw flares.
      const facet = p.l > 0.80 ? Math.random() : 0;
      // The wordmark must stay upright — only the circular mark revolves.
      const isWord = p.y > 0.30;

      return {
        ang, rad, tx, ty, isWord,
        sAng: ang-wind, sRad: spread,
        r:p.r, g:p.g, b:p.b, l:p.l,
        delay: 0.30*(1-Math.min(1,rad/(scale*1.05))) + Math.random()*0.32,
        size: (0.5+p.l*1.15)*(0.75+Math.random()*0.5),
        tw: Math.random()*Math.PI*2,
        twS: 0.8+Math.random()*2.2,
        drift: Math.random()*Math.PI*2,
        // sparkle: rare, sharp, staggered — sun catching one facet at a time
        flare: facet > 0.86,
        fPh: Math.random()*Math.PI*2,
        fSp: 0.35+Math.random()*0.85,
      };
    });

    stars = Array.from({length: Math.floor((W*H)/13000)}, () => ({
      x:Math.random()*W, y:Math.random()*H,
      s:Math.random()*0.9+0.25, a:Math.random()*0.4+0.08,
      ph:Math.random()*Math.PI*2
    }));
  }

  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    cv.width=(W*DPR)|0; cv.height=(H*DPR)|0;
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
  }

  // A diamond glint: white-hot core, gold halo, and a 4-point cross of light
  // with a faint prismatic fringe — the way a cut stone splits sunlight.
  function glint(x, y, s, i){
    const len = s*9;
    ctx.strokeStyle = `rgba(255,240,205,${0.6*i})`;
    ctx.lineWidth = Math.max(0.6, s*0.32);
    ctx.beginPath();
    ctx.moveTo(x-len,y); ctx.lineTo(x+len,y);
    ctx.moveTo(x,y-len); ctx.lineTo(x,y+len);
    ctx.stroke();

    // shorter diagonal pair, softer
    const d = len*0.5;
    ctx.strokeStyle = `rgba(255,236,190,${0.28*i})`;
    ctx.lineWidth = Math.max(0.5, s*0.2);
    ctx.beginPath();
    ctx.moveTo(x-d,y-d); ctx.lineTo(x+d,y+d);
    ctx.moveTo(x+d,y-d); ctx.lineTo(x-d,y+d);
    ctx.stroke();

    // prismatic fringe — the rainbow a real diamond throws
    ctx.strokeStyle = `rgba(120,190,255,${0.18*i})`;
    ctx.lineWidth = Math.max(0.4, s*0.14);
    ctx.beginPath();
    ctx.moveTo(x-len*0.72,y-1.2); ctx.lineTo(x+len*0.72,y-1.2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,150,120,${0.15*i})`;
    ctx.beginPath();
    ctx.moveTo(x-len*0.72,y+1.2); ctx.lineTo(x+len*0.72,y+1.2);
    ctx.stroke();

    // blown-out core
    const gr = ctx.createRadialGradient(x,y,0,x,y,s*3.4);
    gr.addColorStop(0, `rgba(255,248,228,${0.95*i})`);
    gr.addColorStop(0.28, `rgba(255,224,150,${0.55*i})`);
    gr.addColorStop(1, "transparent");
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x,y,s*3.4,0,6.283); ctx.fill();
  }

  function frame(now){
    const el = (now-t0)/1000;
    const done = el > TOTAL;
    const settled = Math.min(1, Math.max(0,(el-T_DRIFT-T_GATHER*0.5)/1.5));
    // the revolve: begins as it lands, then holds a slow constant turn
    const spin = spinOn ? (Math.max(0, el-T_DRIFT-T_GATHER*0.6) * 0.085) : 0;

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(4,5,10,${done?0.26:0.17})`;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = "lighter";

    for(const s of stars){
      const a = s.a*(0.6+0.4*Math.sin(el*1.1+s.ph));
      ctx.fillStyle = `rgba(190,205,230,${a*0.45})`;
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }

    if(settled>0){
      const gr = ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2.3);
      gr.addColorStop(0, `rgba(255,215,140,${0.13*settled})`);
      gr.addColorStop(0.4, `rgba(217,164,65,${0.05*settled})`);
      gr.addColorStop(1,"transparent");
      ctx.fillStyle = gr;
      ctx.fillRect(0,0,W,H);
    }

    for(const p of parts){
      let x,y,alpha,size,bright;

      if(el < T_DRIFT + p.delay){
        const k = el*0.22 + p.drift;
        x = cx + Math.cos(p.sAng+k*0.09)*(p.sRad+Math.sin(k)*22);
        y = cy + Math.sin(p.sAng+k*0.09)*(p.sRad+Math.cos(k*1.3)*22);
        // adrift, but already glittering — diamond dust in the dark
        alpha = 0.30 + 0.45*Math.abs(Math.sin(el*2.4+p.tw));
        size = p.size*0.85; bright = alpha;
      } else if(el < T_DRIFT + p.delay + T_GATHER){
        const u = easeOutQuint(Math.min(1,(el-T_DRIFT-p.delay)/T_GATHER));
        const aim = p.isWord ? p.ang : p.ang + spin;
        const ang = p.sAng + (aim - p.sAng)*easeInOutCubic(u);
        const over = 1 + 0.045*Math.sin(u*Math.PI)*(1-u);
        const rad = (p.sRad + (p.rad-p.sRad)*u)*over;
        x = cx + Math.cos(ang)*rad;
        y = cy + Math.sin(ang)*rad;
        alpha = 0.35 + 0.65*u; size = p.size*(0.85+0.4*u); bright = alpha;
      } else {
        // Settled AND revolving — the mark turns as one body.
        const wob = 0.4*Math.sin(p.drift + el*0.4);
        if(p.isWord){
          x = cx + p.tx + Math.cos(p.drift+el*0.35)*0.45;
          y = cy + p.ty + Math.sin(p.drift+el*0.35)*0.45;
        } else {
          const a = p.ang + spin;
          x = cx + Math.cos(a)*(p.rad+wob);
          y = cy + Math.sin(a)*(p.rad+wob);
        }
        alpha = 0.86 + 0.14*Math.sin(el*p.twS+p.tw);
        size = p.size*(1.03+0.06*Math.sin(el*p.twS*1.3+p.tw));
        bright = alpha;
      }

      // The logo's own pixels run near-white on the upper crescent, which
      // reads as silver once every particle is lit. So brightness is remapped
      // onto a gold ramp instead of preserved: deep bronze in shadow, rich
      // gold at mid, pale champagne at peak — never white. White is reserved
      // for the glint cores, which is where a real stone puts it.
      const L = p.l;
      let rr, gg, bb;
      if (L < 0.5) {                       // shadow → deep bronze
        const k = L / 0.5;
        rr = 96 + k*114; gg = 54 + k*88; bb = 16 + k*30;
      } else {                             // light → gold → champagne
        const k = (L - 0.5) / 0.5;
        rr = 210 + k*45; gg = 142 + k*88; bb = 46 + k*122;
      }
      ctx.fillStyle = `rgba(${rr|0},${gg|0},${bb|0},${alpha*(0.6+p.l*0.4)})`;
      ctx.beginPath(); ctx.arc(x,y,size,0,6.283); ctx.fill();

      // facets catching the light
      if(p.flare){
        const s = Math.sin(el*p.fSp + p.fPh);
        const i = Math.pow(Math.max(0,s), 7);     // sharp, brief, sparse
        if(i > 0.03) glint(x, y, size, i*bright);
      }
    }

    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  if(reduce) t0 = performance.now() - TOTAL*1000 - 1;
  requestAnimationFrame(frame);

  return {
    replay(){ t0 = performance.now(); },
    spin(){ spinOn = !spinOn; }
  };
})();
</script>
</body>
</html>
