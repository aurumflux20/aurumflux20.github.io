<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AurumFlux — hero animation</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden}
  #stage{display:block;width:100vw;height:100vh}
  .replay{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    font:600 13px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(255,255,255,.5);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    padding:11px 20px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px);
    transition:color .2s,border-color .2s;z-index:10;
  }
  .replay:hover{color:#f0d9a8;border-color:rgba(217,164,65,.5)}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<button class="replay" onclick="AF.replay()">Replay</button>

<script src="logo-particles.js"></script>
<script>
const AF = (() => {
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, DPR = 1, scale = 1, cx = 0, cy = 0;
  let parts = [], stars = [];
  let t0 = performance.now();

  // ── timing (seconds) — slow and deliberate is what reads as cinematic ──
  const T_DRIFT   = 0.9;   // stardust drifting in the void
  const T_GATHER  = 3.4;   // spiralling inward into the mark
  const T_SETTLE  = 1.0;   // micro-overshoot resolving
  const TOTAL     = T_DRIFT + T_GATHER + T_SETTLE;

  const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
  const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

  function build() {
    const src = window.AF_PTS || [];
    scale = Math.min(W, H) * 0.34;
    cx = W / 2; cy = H / 2 - H * 0.02;

    parts = src.map((p, i) => {
      // Target: the exact pixel position in the real logo.
      const tx = cx + p.x * scale;
      const ty = cy + p.y * scale;

      // Each particle's own polar coordinate about the centre — the animation
      // walks it IN along its own spiral, so the whole field rotates as it
      // collapses. That orbital collapse is what makes it read as a vortex
      // rather than a magnet.
      const dx = tx - cx, dy = ty - cy;
      const ang = Math.atan2(dy, dx);
      const rad = Math.hypot(dx, dy);

      // Start far out on the same ray, wound back by up to ~2.2 turns.
      const spread = Math.max(W, H) * (0.55 + Math.random() * 0.75);
      const wind = (1.1 + Math.random() * 1.1) * Math.PI * 2;

      return {
        tx, ty, ang, rad,
        sAng: ang - wind,
        sRad: spread,
        r: p.r, g: p.g, b: p.b, l: p.l,
        // stagger: outer particles set off first, so the mark resolves
        // from its rim inward — the eye follows the collapse
        delay: (0.30 * (1 - Math.min(1, rad / (scale * 1.05))) + Math.random() * 0.34),
        size: (0.55 + p.l * 1.25) * (0.75 + Math.random() * 0.5),
        tw: Math.random() * Math.PI * 2,     // shimmer phase
        twS: 0.7 + Math.random() * 1.6,      // shimmer speed
        drift: Math.random() * Math.PI * 2,
      };
    });

    stars = Array.from({ length: Math.floor((W * H) / 14000) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      s: Math.random() * 0.9 + 0.25,
      a: Math.random() * 0.4 + 0.08,
      ph: Math.random() * Math.PI * 2,
    }));
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function frame(now) {
    const el = (now - t0) / 1000;
    const done = el > TOTAL;
    const settled = Math.min(1, Math.max(0, (el - T_DRIFT - T_GATHER * 0.55) / 1.6));

    // ── the void: trail-blur instead of a hard clear, so motion leaves light ──
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(6,7,10,${done ? 0.30 : 0.19})`;
    ctx.fillRect(0, 0, W, H);

    // ambient star field
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      const a = s.a * (0.6 + 0.4 * Math.sin(el * 1.1 + s.ph));
      ctx.fillStyle = `rgba(190,205,230,${a * 0.5})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // warm bloom that swells as the mark forms
    if (settled > 0) {
      const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 2.1);
      gr.addColorStop(0, `rgba(217,164,65,${0.10 * settled})`);
      gr.addColorStop(0.45, `rgba(217,164,65,${0.035 * settled})`);
      gr.addColorStop(1, "transparent");
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);
    }

    for (const p of parts) {
      let x, y, alpha, size;

      if (el < T_DRIFT + p.delay) {
        // Adrift: slow wander far out, barely lit.
        const k = (el * 0.22 + p.drift);
        x = cx + Math.cos(p.sAng + k * 0.09) * (p.sRad + Math.sin(k) * 22);
        y = cy + Math.sin(p.sAng + k * 0.09) * (p.sRad + Math.cos(k * 1.3) * 22);
        alpha = 0.16 + 0.14 * Math.sin(el * 2 + p.tw);
        size = p.size * 0.8;
      } else if (el < T_DRIFT + p.delay + T_GATHER) {
        // The collapse: interpolate along the SPIRAL, not the straight line.
        const u = easeOutQuint(Math.min(1, (el - T_DRIFT - p.delay) / T_GATHER));
        const ang = p.sAng + (p.ang - p.sAng) * easeInOutCubic(u);
        // slight overshoot past the target radius, then relax back
        const over = 1 + 0.045 * Math.sin(u * Math.PI) * (1 - u);
        const rad = (p.sRad + (p.rad - p.sRad) * u) * over;
        x = cx + Math.cos(ang) * rad;
        y = cy + Math.sin(ang) * rad;
        alpha = 0.25 + 0.75 * u;
        size = p.size * (0.8 + 0.45 * u);
      } else {
        // Settled: the mark, breathing.
        const b = Math.sin(el * 0.5) * 0.6;
        x = p.tx + Math.cos(p.drift + el * 0.35) * (0.5 + b * 0.3);
        y = p.ty + Math.sin(p.drift + el * 0.35) * (0.5 + b * 0.3);
        alpha = 0.82 + 0.18 * Math.sin(el * p.twS + p.tw);
        size = p.size * (1.02 + 0.05 * Math.sin(el * p.twS * 1.3 + p.tw));
      }

      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha * (0.55 + p.l * 0.45)})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, 6.283);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();

  if (reduce) {
    // Honour the preference: draw the resolved mark, no journey.
    t0 = performance.now() - TOTAL * 1000 - 1;
  }
  requestAnimationFrame(frame);

  return { replay(){ t0 = performance.now(); } };
})();
</script>
</body>
</html>
